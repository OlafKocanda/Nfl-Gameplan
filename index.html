<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b1a33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tippspiel">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Tippspiel</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏈</text></svg>">
</head>
<body>
<div class="wrap"><p class="meta pad" style="font:16px sans-serif;color:#5d6b85;padding:48px 16px">Lade …</p></div>
<script type="module">
  // Immer die neueste Fassung laden: GitHub Pages lässt Browser Dateien sonst
  // bis zu 10 Minuten zwischenspeichern, und Updates kommen verspätet an.
  const v = Date.now();
  const css = document.createElement("link");
  css.rel = "stylesheet";
  css.href = `app.css?v=${v}`;
  document.head.append(css);
  import(`./app.js?v=${v}`).catch(() => {
    document.querySelector(".wrap").innerHTML = '<p class="meta pad">Die Seite konnte nicht geladen werden. ' +
      'Bitte Verbindung prüfen und neu laden.</p><button onclick="location.reload()">Neu laden</button>';
  });
</script>
</body>
</html>
